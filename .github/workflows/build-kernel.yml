name: Build Whyred Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses5 libncurses5-dev bzip2 libssl-dev bc flex bison libelf-dev zip git ccache \
            libtinfo5 wget tar curl

      - name: 下载并解压内核源码
        run: |
          curl -L "https://github.com/MoKee/android_kernel_xiaomi_whyred/archive/refs/heads/mko-mr1.tar.gz" -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          mv android_kernel_xiaomi_whyred-mko-mr1 kernel-source

      - name: 集成 KernelSU-Next 与兼容性补丁
        run: |
          cd kernel-source

          # 注入 KernelSU-Next（不加无效分支参数，拉取官方推荐默认分支）
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # 配置 kprobes 与 KSU
          DEFCONFIG="arch/arm64/configs/whyred-perf_defconfig"
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG

          # 修复 GCC 11 编译 scripts/dtc 时的 yylloc 重复定义问题
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c || true

      - name: 编译内核
        run: |
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out whyred-perf_defconfig

          # KCFLAGS="-Wno-error" 忽略 GCC 11 对 4.4 旧内核的警告拦截
          make O=out \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            -j$(nproc --all)

      - name: 检查并整理产物
        run: |
          mkdir -p output
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb output/
          elif [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz output/
          fi

      - name: 上传内核产物
        uses: actions/upload-artifact@v4
        with:
          name: whyred-KernelSU-Next-Kernel
          path: output/*
