name: Build KernelSU-Next Debug whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 安装基础编译依赖与工具
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
          g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 squashfs-tools pngcrush \
          schedtool dpkg-dev liblz4-tool make optipng bc libssl-dev libelf-dev python3 python2 abootimg

    - name: 下载并配置编译工具链 (AOSP Clang & GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # 拉取 AOSP 官方 Clang (r383902b)
        mkdir -p clang
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz | tar -xz -C clang
        
        # 拉取 GCC 交叉编译器
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    - name: 拉取 whyred 内核源码
      run: |
        cd $GITHUB_WORKSPACE
        # PixelExperience 官方 whyred 内核源码
        git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_whyred.git -b thirteen kernel

    - name: 注入 KernelSU-Next 并强制硬编码挂载
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        # 1. 运行官方 setup.sh 脚本
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. 如果是软链接，将其转换为真实的物理目录或直接克隆克隆硬编码，确保编译系统100%抓到
        if [ -L drivers/kernelsu ]; then
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git -b next drivers/kernelsu
        fi
        
        # 3. 显式写入 drivers/Makefile 和 drivers/Kconfig 确保硬编码生效
        if ! grep -q "kernelsu" drivers/Makefile; then
          echo "obj-\$(CONFIG_KSU) += kernelsu/" >> drivers/Makefile
        fi
        
        if ! grep -q "kernelsu" drivers/Kconfig; then
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        fi
        
        # 4. 配置 defconfig
        DEFCONFIG="arch/arm64/configs/whyred_defconfig"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG
        sed -i '/CONFIG_OVERLAY_FS/d' $DEFCONFIG
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: 检查 drivers 目录确认 KSU 是否存在
      run: |
        cd $GITHUB_WORKSPACE/kernel
        echo "=== 检查 drivers 目录下的文件 ==="
        ls -la drivers/
        
        if [ -e drivers/kernelsu ] || [ -e drivers/ksu ]; then
          echo "SUCCESS: 检测到 KSU 驱动目录存在！"
          ls -la drivers/kernelsu || ls -la drivers/ksu
        else
          echo "ERROR: 未在 drivers 目录下发现 KSU 驱动！"
          exit 1
        fi

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # 1. 生成基础配置
        make O=out whyred_defconfig CC=clang
        
        # 2. 显式在生成的 .config 中强行勾选开关
        scripts/config --file out/.config -e CONFIG_KSU -e CONFIG_OVERLAY_FS
        
        # 3. 开始多线程编译
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          KCFLAGS="-Wno-error"

    - name: 检查编译产物
      run: |
        if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "内核生成成功: Image.gz-dtb"
        else
          echo "未检测到 Image.gz-dtb，编译失败"
          exit 1
        fi

    - name: 打包为 AnyKernel3 刷机包 (推荐)
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 $GITHUB_WORKSPACE/KernelSU-Next-whyred.zip * -x .git README.md *placeholder

    - name: 替换并生成最终的 boot.img (Fastboot 刷入)
      run: |
        cd $GITHUB_WORKSPACE
        
        if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
          cp "$GITHUB_WORKSPACE/boot.img" "$GITHUB_WORKSPACE/boot-ksu.img"
          abootimg -u "$GITHUB_WORKSPACE/boot-ksu.img" -k "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          echo "boot-ksu.img 打包完成"
        else
          echo "提示：仓库根目录未上传官方 boot.img，请直接使用 AnyKernel3 zip 刷机包"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: whyred-KernelSU-Next-Output
        path: |
          KernelSU-Next-whyred.zip
          boot-ksu.img
