name: Build KernelSU-Next In-Tree for whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 安装基础编译依赖与工具
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
          g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 squashfs-tools pngcrush \
          schedtool dpkg-dev liblz4-tool make optipng bc libssl-dev libelf-dev python3 python2 abootimg

    - name: 下载并配置编译工具链 (AOSP Clang & GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        mkdir -p clang
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz | tar -xz -C clang
        
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    - name: 拉取 whyred 内核源码
      run: |
        cd $GITHUB_WORKSPACE
        git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_whyred.git -b thirteen kernel

    - name: 部署 KernelSU-Next 并修复所有 Clang 兼容性补丁
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        # 1. 运行官方设置脚本注入驱动
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. 修复蓝牙驱动头文件尖括号报错
        find drivers/bluetooth/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/<\(btfm_.*\.h\)>/"\1"/g' {} +
        
        # 3. 彻底修复 GPU kgsl_trace.h 路径解析错误
        if [ -f "drivers/gpu/msm/kgsl_trace.h" ]; then
          sed -i 's|#include "./kgsl_trace.h"|#include "kgsl_trace.h"|g' drivers/gpu/msm/kgsl_trace.h
          sed -i 's|#include "./drivers/gpu/msm/kgsl_trace.h"|#include "kgsl_trace.h"|g' drivers/gpu/msm/kgsl_trace.h
          sed -i 's|#define TRACE_INCLUDE_PATH .*|#define TRACE_INCLUDE_PATH drivers/gpu/msm|g' drivers/gpu/msm/kgsl_trace.h
        fi
        
        # 4. 写入 defconfig 基础配置
        DEFCONFIG="arch/arm64/configs/whyred_defconfig"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG
        sed -i '/CONFIG_OVERLAY_FS/d' $DEFCONFIG
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: 原位编译内核 (单线程排错防混淆模式)
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # 1. 清理旧缓存
        make clean
        make mrproper
        
        # 2. 生成默认配置
        make whyred_defconfig CC=clang
        
        # 3. 强制在根目录 .config 中开启开关
        scripts/config --file .config -e CONFIG_KSU -e CONFIG_OVERLAY_FS
        make olddefconfig CC=clang
        
        # 4. 使用单线程模式排错 (-j1) 确保最后错误清晰
        make -j1 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          KCFLAGS="-Wno-error"

    - name: 检查编译产物
      run: |
        if [ -f "$GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "内核生成成功: Image.gz-dtb"
        else
          echo "未检测到 Image.gz-dtb，编译失败"
          exit 1
        fi

    - name: 打包为 AnyKernel3 刷机包
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        cp $GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 $GITHUB_WORKSPACE/KernelSU-Next-whyred.zip * -x .git README.md *placeholder

    - name: 生成 boot-ksu.img (Fastboot 刷入)
      run: |
        cd $GITHUB_WORKSPACE
        if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
          cp "$GITHUB_WORKSPACE/boot.img" "$GITHUB_WORKSPACE/boot-ksu.img"
          abootimg -u "$GITHUB_WORKSPACE/boot-ksu.img" -k "$GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz-dtb"
          echo "boot-ksu.img 打包完成"
        else
          echo "提示：仓库根目录未上传官方 boot.img，跳过 boot-ksu.img 生成"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: whyred-KernelSU-Next-Output
        path: |
          KernelSU-Next-whyred.zip
          boot-ksu.img
