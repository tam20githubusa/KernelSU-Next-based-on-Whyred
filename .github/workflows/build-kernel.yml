name: Build Whyred Kernel with KernelSU-Next & Repack Boot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 检查底包压缩包是否存在
        run: |
          if [ ! -f "stock_boot.zip" ]; then
            echo "::error::未在仓库根目录找到 stock_boot.zip！请将底包压缩后命名为 stock_boot.zip 并上传到仓库根目录。"
            exit 1
          fi

      - name: 安装交叉编译与解包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses5 libncurses5-dev bzip2 libssl-dev bc flex bison libelf-dev zip unzip git ccache \
            libtinfo5 wget tar curl

      - name: 下载并解压内核源码
        run: |
          curl -L "https://github.com/MoKee/android_kernel_xiaomi_whyred/archive/refs/heads/mko-mr1.tar.gz" -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          mv android_kernel_xiaomi_whyred-mko-mr1 kernel-source

      - name: 集成 KernelSU-Next 与兼容性补丁
        run: |
          cd kernel-source

          # 注入 KernelSU-Next（拉取官方默认分支）
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

          # 配置 kprobes 与 KSU
          DEFCONFIG="arch/arm64/configs/whyred-perf_defconfig"
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG

          # 修复 GCC 11 编译 scripts/dtc 时的 yylloc 重复定义问题
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c || true

      - name: 编译内核
        run: |
          cd kernel-source

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out whyred-perf_defconfig

          # 编译内核并忽略非致命告警
          make O=out \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            -j$(nproc --all)

      - name: 使用 magiskboot 解包底包并重新打包 boot.img
        run: |
          # 验证编译产物
          KERNEL_PATH="kernel-source/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_PATH" ]; then
            KERNEL_PATH="kernel-source/out/arch/arm64/boot/Image.gz"
          fi

          if [ ! -f "$KERNEL_PATH" ]; then
            echo "::error::未找到编译出的内核镜像文件！"
            exit 1
          fi

          # 创建独立解包/重打包目录
          mkdir -p repack_workspace
          cd repack_workspace

          # 获取 Linux 预编译版 magiskboot
          curl -sL "https://raw.githubusercontent.com/tiann/KernelSU/main/userspace/ksud/bin/magiskboot" -o magiskboot
          chmod +x magiskboot

          # 解压 stock_boot.zip
          unzip -o ../stock_boot.zip -d ./

          # 自动匹配内部解压出的 img 文件名并统一定义为 stock.img
          if [ -f "stock_boot.img" ]; then
            mv stock_boot.img stock.img
          elif [ -f "boot.img" ]; then
            mv boot.img stock.img
          else
            # 兼容任意名称的单个 img
            IMG_FILE=$(find . -maxdepth 1 -name "*.img" | head -n 1)
            if [ -n "$IMG_FILE" ]; then
              mv "$IMG_FILE" stock.img
            else
              echo "::error::在 stock_boot.zip 中未找到任何 .img 格式的镜像！"
              exit 1
            fi
          fi

          # 解包底包镜像
          ./magiskboot unpack stock.img

          # 用新编译的内核替换解包出的 kernel
          cp ../$KERNEL_PATH ./kernel

          # 重新组装生成 boot.img
          ./magiskboot repack stock.img boot.img

          # 移动打包完成的镜像至输出目录
          mkdir -p ../output
          mv boot.img ../output/boot.img

      - name: 上传 boot.img 产物
        uses: actions/upload-artifact@v4
        with:
          name: whyred-KernelSU-Next-boot
          path: output/boot.img
