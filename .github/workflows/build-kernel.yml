name: Build KernelSU for Redmi Note 5 (whyred)

on:
  workflow_dispatch:

jobs:
  build:
  # 统一强制在 ubuntu-22.04 运行
    runs-on: ubuntu-22.04

    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 检查 stock_boot.zip 是否存在
        run: |
          if [ ! -f "stock_boot.zip" ]; then
            echo "::error::未在仓库根目录找到 stock_boot.zip！请将底包压缩后命名为 stock_boot.zip 并上传到仓库根目录。"
            exit 1
          fi

      - name: 安装交叉编译与解包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses5 libncurses5-dev bzip2 libssl-dev bc flex bison libelf-dev zip unzip git ccache \
            libtinfo5 wget tar curl

      - name: 下载并解压内核源码 (MoKee 4.4 分支)
        run: |
          curl -L "https://github.com/MoKee/android_kernel_xiaomi_whyred/archive/refs/heads/mko-mr1.tar.gz" -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          mv android_kernel_xiaomi_whyred-mko-mr1 kernel-source

      - name: 集成经典版 KernelSU v0.9.5 与配置项
        run: |
          cd kernel-source
          
          # 注入经典版 KernelSU 并指定 v0.9.5 标签
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5
          
          # 针对 whyred-perf_defconfig 配置 KSU 与 kprobes
          DEFCONFIG="arch/arm64/configs/whyred-perf_defconfig"
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG || true
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' $DEFCONFIG || true
          sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' $DEFCONFIG || true
          echo "CONFIG_KSU=y" >> $DEFCONFIG

          # 修复 GCC 11 编译 scripts/dtc 兼容性问题
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true

      - name: 编译内核
        run: |
          cd kernel-source
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out whyred-perf_defconfig

          # 编译内核并忽略非致命告警
          make O=out \
            HOSTCFLAGS="-fcommon" \
            HOSTCXXFLAGS="-fcommon" \
            KCFLAGS="-Wno-error" \
            -j$(nproc --all)

      - name: 使用 magiskboot 解包底包并重新打包 boot.img
        run: |
          KERNEL_PATH="kernel-source/out/arch/arm64/boot/Image.gz-dtb"
          if [ ! -f "$KERNEL_PATH" ]; then
            KERNEL_PATH="kernel-source/out/arch/arm64/boot/Image.gz"
          fi

          if [ ! -f "$KERNEL_PATH" ]; then
            echo "::error::未找到编译出的内核镜像文件！"
            exit 1
          fi

          mkdir -p repack_workspace
          cd repack_workspace

          # 提取 magiskboot
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -o magisk.zip
          unzip -p magisk.zip "lib/x86_64/libmagiskboot.so" > magiskboot
          chmod +x magiskboot
          rm -f magisk.zip

          # 解压底包
          unzip -o ../stock_boot.zip -d ./

          if [ -f "stock_boot.img" ]; then
            mv stock_boot.img stock.img
          elif [ -f "boot.img" ]; then
            mv boot.img stock.img
          else
            IMG_FILE=$(find . -maxdepth 1 -name "*.img" | head -n 1)
            if [ -n "$IMG_FILE" ]; then
              mv "$IMG_FILE" stock.img
            else
              echo "::error::在 stock_boot.zip 中未找到任何 .img 格式的镜像！"
              exit 1
            fi
          fi

          # 解包、替换内核、重新打包
          ./magiskboot unpack stock.img
          cp ../$KERNEL_PATH ./kernel
          ./magiskboot repack stock.img

          if [ ! -f "new-boot.img" ]; then
            echo "::error::magiskboot 打包失败，未生成 new-boot.img"
            exit 1
          fi

          mkdir -p ../output
          mv new-boot.img ../output/boot.img

      - name: 上传 boot.img 产物
        uses: actions/upload-artifact@v4
        with:
          name: whyred-KernelSU-v0.9.5-boot
          path: output/boot.img
