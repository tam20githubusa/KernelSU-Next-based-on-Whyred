name: Build KernelSU-Next for whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5 libncurses5-dev bzip2 \
            libssl-dev bc flex bison libelf-dev zip git ccache libtinfo5

      - name: 拉取内核源码与编译器
        run: |
          # whyred 的 Android Pie 内核分支在官方仓库中归在 wayne-p-oss (共用平台源码)
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b wayne-p-oss kernel-source
          
          # 拉取兼容 Android 9 的 Google 官方 GCC 4.9 交叉编译器
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-aarch64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain-arm

      - name: 集成 KernelSU-Next 与 4.4 内核补丁
        run: |
          cd kernel-source
          
          # 拉取 KernelSU-Next 源码
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # 开启内核 kprobes 与 KSU 支持
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' arch/arm64/configs/whyred-perf_defconfig
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' arch/arm64/configs/whyred-perf_defconfig
          sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' arch/arm64/configs/whyred-perf_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/whyred-perf_defconfig

      - name: 编译内核
        run: |
          cd kernel-source
          export PATH=$(pwd)/../toolchain-aarch64/bin:$(pwd)/../toolchain-arm/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out whyred-perf_defconfig
          make O=out -j$(nproc --all)

      - name: 打包 AnyKernel3 刷机包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          # 适配 whyred 分区配置
          sed -i 's/device.name1=.*/device.name1=whyred/' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/' anykernel.sh
          
          # 复制生成的内核文件
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 ../KernelSU-Next-whyred-V12.0.2.0.zip * -x .git README.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-whyred
          path: KernelSU-Next-whyred-V12.0.2.0.zip
