name: Build KernelSU-Next Kernel for whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 安装基础编译依赖与工具
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
          g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush \
          schedtool dpkg-dev liblz4-tool make optipng bc libssl-dev libelf-dev python3 python2

    - name: 下载并配置编译工具链 (AOSP Clang & GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # 克隆 AOSP Clang 12 (whyred 4.4 内核常用的稳定工具链)
        git clone --depth=1 https://github.com/llvm-mirror/clang.git -b master clang || \
        git clone --depth=1 https://gitlab.com/c3eru/aosp-clang.git -b clang-r383902 clang
        
        # 克隆 GCC 交叉编译器 (aarch64 与 arm32)
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    - name: 拉取 whyred 内核源码
      run: |
        cd $GITHUB_WORKSPACE
        # PixelExperience 官方 whyred 内核仓库（4.4 分支）
        git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_whyred.git -b thirteen kernel
        
    - name: 注入 KernelSU-Next
      run: |
        cd $GITHUB_WORKSPACE/kernel
        # 针对 4.4 老内核，执行 KernelSU-Next 内核树注入脚本
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        
        # 针对 4.4 内核，修改或确保 defconfig 启用必要项
        DEFCONFIG="arch/arm64/configs/whyred_defconfig"
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # 生成配置
        make O=out whyred_defconfig CC=clang
        
        # 开始编译
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi-

    - name: 检查编译产物
      run: |
        if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "内核二进制生成成功: Image.gz-dtb"
        else
          echo "编译失败，未找到 Image.gz-dtb"
          exit 1
        fi

    - name: 打包为 AnyKernel3 刷机包 (推荐)
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 $GITHUB_WORKSPACE/KernelSU-Next-whyred.zip * -x .git README.md *placeholder

    - name: 替换并生成最终的 boot.img
      run: |
        cd $GITHUB_WORKSPACE
        # 下载 magiskboot 二进制工具
        wget -q https://github.com/Kitadai31/magiskboot_ndk_on_linux/releases/download/v27.0/magiskboot -O magiskboot
        chmod +x magiskboot
        
        # 准备解包目录
        mkdir -p boot_repack && cd boot_repack
        
        # 如果仓库根目录下预先放了官方的 boot.img，则执行解包替换；
        # 若未放置，则跳过 boot.img 独立生成（仍保留上面的 AnyKernel3 zip 包）。
        if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
          cp $GITHUB_WORKSPACE/boot.img ./boot.img
          ../magiskboot unpack boot.img
          
          # 替换内核为刚刚编译出的产物
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb ./kernel
          
          # 重打包
          ../magiskboot repack boot.img $GITHUB_WORKSPACE/boot-ksu.img
          echo "boot-ksu.img 打包完成"
        else
          echo "仓库根目录未检测到原版 boot.img，将跳过生成 boot-ksu.img，仅输出 AnyKernel3 刷机包。"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: whyred-KernelSU-Next-Output
        path: |
          KernelSU-Next-whyred.zip
          boot-ksu.img
