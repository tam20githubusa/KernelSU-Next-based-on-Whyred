name: Build KernelSU-Next for whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出构建仓库
        uses: actions/checkout@v4

      - name: 安装交叉编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libncurses5 libncurses5-dev bzip2 libssl-dev bc flex bison libelf-dev zip git ccache \
            libtinfo5 wget tar curl

      - name: 下载并解压内核源码
        run: |
          # 从 MoKee 官方公开仓库下载 whyred 源码树
          curl -L "https://github.com/MoKee/android_kernel_xiaomi_whyred/archive/refs/heads/mko-mr1.tar.gz" -o kernel.tar.gz
          tar -xzf kernel.tar.gz
          mv android_kernel_xiaomi_whyred-mko-mr1 kernel-source

      - name: 集成 KernelSU-Next 与兼容性补丁
        run: |
          cd kernel-source
          
          # 注入 KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          
          # 开启内核 kprobes 与 KSU 支持
          DEFCONFIG="arch/arm64/configs/whyred-perf_defconfig"
          sed -i 's/# CONFIG_KPROBES is not set/CONFIG_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_HAVE_KPROBES is not set/CONFIG_HAVE_KPROBES=y/' $DEFCONFIG
          sed -i 's/# CONFIG_KPROBE_EVENTS is not set/CONFIG_KPROBE_EVENTS=y/' $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG

          # 修复 GCC 11 链接 scripts/dtc 报 yylloc multiple definition 的问题
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c || true

      - name: 编译内核
        run: |
          cd kernel-source
          
          export ARCH=arm64
          export SUBARCH=arm64
          # 使用 Ubuntu 原生提供的标准 aarch64 交叉编译器
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out whyred-perf_defconfig
          # 传递 HOSTCFLAGS 允许常见符号合并
          make O=out HOSTCFLAGS="-fcommon" HOSTCXXFLAGS="-fcommon" -j$(nproc --all)

      - name: 打包 AnyKernel3 刷机包
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          # 适配 whyred 分区与引导格式
          sed -i 's/device.name1=.*/device.name1=whyred/' anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh
          sed -i 's/is_slot_device=1;/is_slot_device=0;/' anykernel.sh
          
          # 提取 Image.gz-dtb
          cp ../kernel-source/out/arch/arm64/boot/Image.gz-dtb .
          zip -r9 ../KernelSU-Next-whyred-V12.0.2.0.zip * -x .git README.md

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-whyred
          path: KernelSU-Next-whyred-V12.0.2.0.zip
