name: Build KernelSU-Next (Manual Hook) for whyred

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 安装基础编译依赖与工具
      run: |
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev \
          g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 squashfs-tools pngcrush \
          schedtool dpkg-dev liblz4-tool make optipng bc libssl-dev libelf-dev python3 python2 abootimg

    - name: 下载并配置编译工具链 (AOSP Clang & GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # 拉取 AOSP 官方 Clang (r383902b)
        mkdir -p clang
        curl -LSs https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz | tar -xz -C clang
        
        # 拉取 GCC 交叉编译器
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc32

    - name: 拉取 whyred 内核源码
      run: |
        cd $GITHUB_WORKSPACE
        # PixelExperience 官方 whyred 内核源码
        git clone --depth=1 https://github.com/PixelExperience-Devices/kernel_xiaomi_whyred.git -b thirteen kernel

    - name: 注入 KernelSU-Next 并执行手动挂钩 (Manual Hook)
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        # 1. 注入 KernelSU-Next 驱动源码
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
        # 2. 在关键系统调用处注入 Manual Hook (完美绕过 Kprobes 限制)
        # fs/exec.c (execve hook)
        sed -i '/setup_new_exec(bprm);/a \    extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);' fs/exec.c
        
        # fs/open.c (faccessat hook)
        sed -i '/return do_faccessat(AT_FDCWD, filename, mode);/i \    extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);' fs/open.c
        
        # fs/read_write.c (vfs_read hook)
        sed -i '/ret = do_sync_read(file, buf, count, pos);/i \    extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos_ptr);\n    ksu_handle_vfs_read(&file, &buf, &count, &pos);' fs/read_write.c

        # 3. 配置 defconfig，仅开启 KSU 自身与 OverlayFS 支持
        DEFCONFIG="arch/arm64/configs/whyred_defconfig"
        sed -i '/CONFIG_KSU/d' $DEFCONFIG
        sed -i '/CONFIG_OVERLAY_FS/d' $DEFCONFIG
        echo "CONFIG_KSU=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG

    - name: 编译内核
      run: |
        cd $GITHUB_WORKSPACE/kernel
        
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        # 生成基础配置
        make O=out whyred_defconfig CC=clang
        
        # 开始多线程编译，带上 KCFLAGS="-Wno-error" 忽略旧驱动非致命告警
        make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          KCFLAGS="-Wno-error"

    - name: 检查编译产物
      run: |
        if [ -f "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "内核生成成功: Image.gz-dtb"
        else
          echo "未检测到 Image.gz-dtb，编译失败"
          exit 1
        fi

    - name: 打包为 AnyKernel3 刷机包 (推荐)
      run: |
        cd $GITHUB_WORKSPACE
        git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 $GITHUB_WORKSPACE/KernelSU-Next-whyred.zip * -x .git README.md *placeholder

    - name: 替换并生成最终的 boot.img (Fastboot 刷入)
      run: |
        cd $GITHUB_WORKSPACE
        
        if [ -f "$GITHUB_WORKSPACE/boot.img" ]; then
          cp "$GITHUB_WORKSPACE/boot.img" "$GITHUB_WORKSPACE/boot-ksu.img"
          abootimg -u "$GITHUB_WORKSPACE/boot-ksu.img" -k "$GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.gz-dtb"
          echo "boot-ksu.img 打包完成"
        else
          echo "提示：仓库根目录未上传官方 boot.img，请直接使用 AnyKernel3 zip 刷机包"
        fi

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: whyred-KernelSU-Next-Output
        path: |
          KernelSU-Next-whyred.zip
          boot-ksu.img
